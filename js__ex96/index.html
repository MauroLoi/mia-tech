    <script>

        const apiUrl = "http://client.cors-api.appspot.com/client"

        const proxyUrl = "https://cors-anywhere.herokuapp.com/"

        async function getData() {
            try {
                const response = await fetch(proxyUrl + apiUrl)
                const data = await response.json()
            } catch (error) {
                console.error(error)
            }  
        } 

        getData()
            
    </script>
