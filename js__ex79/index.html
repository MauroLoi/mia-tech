<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>

        function funzionePromessa(condizione) {
            return new Promise(function (resolve, reject) {
                setTimeout(() => {

                    if (condizione) {
                        resolve("Promessa mantenuta!") 
                    } else {
                        reject("Promessa NON mantenuta!")
                    }
                }, 2000)
            })
        }

        funzionePromessa(true)
            .then(result => console.log(result)) 
            .catch(error => console.error(error))
            .finally(() => console.log("Promessa eseguita")) 


    </script>
</body>

</html>
