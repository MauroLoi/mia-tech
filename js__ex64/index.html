<!DOCTYPE html>

<body>
    <script>

        function formatPersona(persona) {
            return `
            nome: ${persona.nome},
            cognome: ${persona.cognome},
            età: ${persona.età} `
        }

        const esempioPersona = {
            nome: "Marco",
            cognome: "Bianchi",
            età: 16

        }

        const personaRandom = formatPersona(esempioPersona)
        console.log(personaRandom)
        
    </script>
</body>
</html>
