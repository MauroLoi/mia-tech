<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>

        function parolaLunga() {
            return new Promise(function(resolve, reject){
                const parola = "gatto"
                if (parola.length >= 6) {
                    resolve(parola)
                } else {
                    reject(`Errore! ${parola} ha meno di 6 lettere`)
                }
               
            })
        }

        parolaLunga()
           .then((parola) => {
            console.log(`OK! ${parola} ha almeno 6 lettere`)
           })
           .catch((error) => {
            console.error(error)
           })
            

    </script>
</body>

</html>
