<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#8b008b",
            secondary: "#ffe4c4",
            tertiary: "#87ceeb",
          },
        },
      },
    };
  </script>
  <style type="text/tailwindcss">
    @layer components {
      .box {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 40px;
        max-width: 100%;
        height: 700px;
        padding: 20px;
        padding-bottom: 70px;
        margin: 10px;
        border: 2px groove;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        background-color: rgb(62, 82, 104);
        color: rgb(252, 251, 237)
      }
    }
  </style>
</head>
<body>
  <div class="box sm:bg-green-900 md:bg-sky-900 xl:bg-violet-900">
    <h3>Titolo</h3>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Officia enim asperiores quam aut repellat? Aut excepturi eaque optio alias similique.</p>

</html>
