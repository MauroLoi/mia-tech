<body>
    <script>

        function privacyPolicy() {
            return new Promise(function(resolve, reject){
                const accept = false
                if (accept === true) {
                    resolve(accept)
                } else {
                    reject(`Errore! accetta la politica sulla privacy.`)
                }
               
            })
        }

        privacyPolicy()
           .then((accept) => {
            console.log("Hai accettato la politica sulla privacy!")
           })
           .catch((error) => {
            console.error(error)
           })
            

    </script>
</body>
