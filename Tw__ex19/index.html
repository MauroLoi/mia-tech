<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#8b008b",
            secondary: "#ffe4c4",
            tertiary: "#87ceeb",
          },
        },
      },
    };
  </script>
  <style type="text/tailwindcss">
    @layer components {
      .para {
        background-color: beige;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 22px;
        text-align: center;
        padding: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="flex flex-row">
    <div class="bg-red-500 p-4 m-2">item</div>
    <div class="bg-lime-500 p-4 m-2">item</div>
    <div class="bg-blue-500 p-4 m-2">item</div>
  </div>
  <div class="flex">
    <div class="bg-red-500 p-4 m-2 flex-1">item</div>
    <div class="bg-lime-500 p-4 m-2 flex-1">item</div>
    <div class="bg-blue-500 p-4 m-2 flex-1">item</div>
  </div>
  <div class="flex flex-col">
    <div class="bg-red-500 p-4 m-2">item</div>
    <div class="bg-lime-500 p-4 m-2">item</div>
    <div class="bg-blue-500 p-4 m-2">item</div>
  </div>

</html>
