<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

        function createCounter() {
            let count = 0

            return {
                increment: function() {
                    count += 1
                    return count
                },
                decrement: function() {
                    count -= 1
                    return count
                }
            }
        }

        let counter = createCounter()

        console.log(counter.increment())
        console.log(counter.decrement())

    </script>
</body>
</html>
