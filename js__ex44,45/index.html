<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

<body>
    <script>

        class Automobile {
            marca = ""
            modello = ""
            anno = ""
            chilometraggio = 0
            #contatoreChiamate = 0

            constructor(marca, modello, anno, chilometraggio = 0) {
                this.marca = marca
                this.modello = modello
                this.anno = anno
                this.chilometraggio = chilometraggio
            }

            #incrementaContatore() {
                this.#contatoreChiamate++
            }

            static confrontaChilometraggio(auto1, auto2) {
                if (auto1.chilometraggio > auto2.chilometraggio) {
                    return `${auto1.marca} ${auto1.modello} ha più chilometri di ${auto2.marca} ${auto2.modello}.`;
                } else if (auto1.chilometraggio < auto2.chilometraggio) {
                    return `${auto2.marca} ${auto2.modello} ha più chilometri di ${auto1.marca} ${auto1.modello}.`;
                } else {
                    return `${auto1.marca} ${auto1.modello} e ${auto2.marca} ${auto2.modello} hanno lo stesso chilometraggio.`;
                }
            }

            _controllaChilometri() {
                let limiteChilometri = 100000
                if (this.chilometraggio > limiteChilometri) {
                    console.log("L'automobile supera i 100.000 km")
                }
            }

            #calcolaEtà() {
                const annoCorrente = new Date().getFullYear();
                return annoCorrente - this.anno;
            }

            mostraEtà() {
                console.log(`L'automobile ha ${this.#calcolaEtà()} anni.`)
            }

            descrizione() {
                return `L'automobile è una ${this.marca} ${this.modello} del ${this.anno}.`
            }

            aggiungiChilometri(km) {
                if (km > 0) {
                    this.chilometraggio += km;
                    this.#incrementaContatore();
                }
            }

            mostraContatoreChiamate() {
                return `I km sono stati aggiunti ${this.#contatoreChiamate} volte.`
            }

            get mostraChilometraggioAttuale() {
                return `Chilometraggio attuale: ${this.chilometraggio} km`
            }

            set setChilometraggio(newChilometraggio) {
                if (newChilometraggio >= this.chilometraggio) {
                    this.chilometraggio = newChilometraggio;
                } else {
                    console.log("Il chilometraggio non può essere diminuito!");
                }
            }
        }


        let Fiesta = new Automobile("Ford", "Fiesta", 2010)
        // console.log(Fiesta.descrizione())
        // console.log(Fiesta.mostraEtà())

        Fiesta.aggiungiChilometri(80000)
        Fiesta.aggiungiChilometri(500)
        Fiesta.aggiungiChilometri(1200)
        // console.log(Fiesta.mostraContatoreChiamate())
        // console.log(Fiesta.mostraChilometraggioAttuale)

        // Fiesta.setChilometraggio = 5000

        class Camion extends Automobile {
            caricoMassimo = ""
            caricoAttuale = ""

            constructor(marca, modello, anno, chilometraggio = 0, caricoMassimo = 0) {
                super(marca, modello, anno, chilometraggio)
                this.caricoMassimo = caricoMassimo
            }

            descrizione() {
                return `Il camion è un ${this.marca} ${this.modello} del ${this.anno} e ha un carico massimo di ${this.caricoMassimo} kg .`
            }

            carica(kg) {
                if (this.caricoAttuale + kg <= this.caricoMassimo) {
                    this.caricoAttuale += kg;
                    console.log(`Il camion ha caricato ${kg} kg. Carico attuale: ${this.caricoAttuale} kg.`);
                } else {
                    console.log("Il carico supera il limite massimo consentito!")
                }
            }
        }    
       

        let Volvo = new Camion("Volvo", "FM", 2018, 1500, 20000)
        console.log(Volvo.descrizione())

        Volvo.carica(5500)
        Volvo.carica(10000000)
        

    </script>
</body>
