<body>
    <script>

        function funzioneUno() {
            return new Promise(function(resolve, reject){
                const accept = true
                if (accept === true) {
                    resolve("OK! Hai accettato!")
                } else {
                    reject("Errore! non hai accettato!")
                }
            })
        }

        function funzioneDue() {
            return new Promise(function(resolve, reject){
                const accept = true
                if (accept === true) {
                    resolve("OK! Hai accettato!")
                } else {
                    reject("Errore! non hai accettato!")
                }
            })
        }

        function funzioneTre() {
            return new Promise(function(resolve, reject){
                const accept = false
                if (accept === true) {
                    resolve("OK! Hai accettato!")
                } else {
                    reject("Errore! non hai accettato!")
                }
            })
        }

        Promise.allSettled([
            funzioneUno(),
            funzioneDue(),
            funzioneTre(),
        ]).then(function(allPromise) {
            console.log(allPromise)
        })


        
            

    </script>
