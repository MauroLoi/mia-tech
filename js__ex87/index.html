<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>

        function promessaUno() {
            return new Promise (function(resolve, reject) {
                setTimeout(() => resolve("Ferrari"), 3000)
            })
        }

        function promessaDue() {
            return new Promise(function(resolve, reject) {
                setTimeout(() => resolve("Redbull"), 5000)
            })
        }

        Promise.race([
            promessaUno(),
            promessaDue(),
        ]).then(function(promesseMantenute) {
            console.log(promesseMantenute)
        })



        

    </script>
</body>

</html>
